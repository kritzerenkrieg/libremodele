# Release builds (Phase I, I1–I4): checks, then the Windows and Debian builds
# of the desktop app and the CLI, then a published GitHub Release for a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release (and its new lints) can't break a release
  # build; bump it in the maintenance turn (ROADMAP).
  RUST_VERSION: 1.100.0

jobs:
  checks:
    name: Checks (I4)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version (I1)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in \
            "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" \
            "$(grep -m1 '^version' gui/src-tauri/Cargo.toml | cut -d'"' -f2)" \
            "$(node -p "require('./gui/src-tauri/tauri.conf.json').version")" \
            "$(node -p "require('./gui/package.json').version")"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match version $v"
              exit 1
            fi
          done

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Rust
        # bash on every runner: PowerShell wouldn't expand $RUST_VERSION.
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy,rustfmt && rustup default "$RUST_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Front end
        working-directory: gui
        run: npm ci && npm run build && npm run check

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Sample-based tests skip without samples/ (A6); the built-in donor tests run.
      - run: cargo test --release --workspace

  build:
    name: Build ${{ matrix.name }} (I2)
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis,msi
          - name: debian
            # 22.04's WebKitGTK 4.1 keeps the .deb installable on Debian 12+.
            os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Rust
        # bash on every runner: PowerShell wouldn't expand $RUST_VERSION.
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Desktop app
        working-directory: gui
        run: npm ci && npx tauri build --bundles ${{ matrix.bundles }}

      - name: CLI
        run: cargo build --release -p libremodele --bin libremodele

      - name: Collect files
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p dist cli
          cp LICENSE README.md cli/
          bundle=target/release/bundle
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$bundle"/nsis/*.exe "$bundle"/msi/*.msi dist/
            cp target/release/libremodele.exe cli/
            (cd cli && 7z a "../dist/libremodele-cli-${version}-windows-x64.zip" .)
          else
            cp "$bundle"/deb/*.deb dist/
            cp target/release/libremodele cli/
            tar -czf "dist/libremodele-cli-${version}-linux-x64.tar.gz" -C cli .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: libremodele-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release (I3)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "libremodele $GITHUB_REF_NAME" \
            --generate-notes
